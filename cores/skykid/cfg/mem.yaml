params:
  - { name: BG_OFFSET,   value: "(`BG_START-`JTFRAME_BA2_START)>>1" }
  - { name: OBJ2_OFFSET, value: "(`OBJ2_START-`JTFRAME_BA3_START)>>1" }
clocks:
  clk48:
    - freq: 3072k
      outputs:
        - cen_c30
audio:
  rsum: 1k
  channels:
    - { name: cus30, module: jtcus30, rsum: 1k }
ports:
  - { name: cpu_dout, msb:  7, lsb: 0 }
  - { name: cpu_addr, msb: 15, lsb: 0 }
sdram:
  banks:
    - buses:
      - name: main          # 0x8000-0xffff static + 2x8kB banked
        addr_width: 16
        data_width: 8
    - buses:
      - name: mcusub        # MCU external program, 8kB
        addr_width: 13
        data_width: 8
    - buses:
      - name: scr0          # text layer characters, 2bpp
        addr_width: 13
        data_width: 16
        gfx_sort: hvvv
      - name: scr1          # background tiles, 2bpp, rows already adjacent
        addr_width: 13
        data_width: 16
        offset: BG_OFFSET
    - buses:
      - name: obj           # sprites, planes 1 and 2
        addr_width: 15
        data_width: 16
        gfx_sort: hvvv
      - name: obj2          # sprite third plane, tiles 0-255 only
        addr_width: 14
        data_width: 16
        offset: OBJ2_OFFSET
        gfx_sort: hvvv
bram:
  # PROM order here must match the MRA order
  - name: mcu               # HD63701 internal ROM (CUS60/CUS63)
    addr_width: 12
    data_width: 8
    prom: true
  - name: rpal              # red, 4 bits
    addr_width: 8
    data_width: 8
    addr: rgb_addr
    prom: true
  - name: gpal              # green, 4 bits
    addr_width: 8
    data_width: 8
    addr: rgb_addr
    prom: true
  - name: bpal              # blue, 4 bits
    addr_width: 8
    data_width: 8
    addr: rgb_addr
    prom: true
  - name: scrpal            # tile colour lookup
    addr_width: 9
    data_width: 8
    prom: true
  - name: objpal            # sprite colour lookup
    addr_width: 9
    data_width: 8
    prom: true
  # Video RAM
  - name: vram1             # background, 0x2000-0x2fff (code + attribute)
    addr_width: 12
    data_width: 16
    simfile: {}
    dual_port:
      name: bg
      addr: cpu_addr[11:1]
      din:  "{2{cpu_dout}}"
      dout: bg_dout
      rw:   true
    ioctl: { save: true, order: 0 }
  - name: vram0             # text, 0x4000-0x47ff (code + attribute)
    addr_width: 11
    data_width: 16
    simfile: {}
    dual_port:
      name: tx
      addr: cpu_addr[10:1]
      din:  "{2{cpu_dout}}"
      dout: tx_dout
      rw:   true
    ioctl: { save: true, order: 1 }
  - name: oram              # sprite RAM, 0x4800-0x5fff
    addr_width: 13
    data_width: 16
    dual_port:
      name: osh
      addr: cpu_addr[12:1]
      din:  "{2{cpu_dout}}"
      dout: osh_dout
      rw:   true
    ioctl: { save: true, order: 2 }
  # sound RAM connected to cus30
  - name: sndram
    rw: true
    addr_width: 12
    data_width: 8
