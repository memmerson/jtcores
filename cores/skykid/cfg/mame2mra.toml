[parse]
sourcefile=[ "skykid.cpp" ]
main_setnames=["drgnbstr"]

[buttons]
names=[
	{ machine="drgnbstr", names="Attack,Jump" },
	{ machine="skykid",   names="Shot,Loop" },
]

[header]
registers = [
	# Sky Kid runs with the board flipped and MAME rotates the output 180 degrees
	{ name="rot180", pos="1[0]", values=[{machines=["skykid"], value=1}], desc="Rotate the output 180 degrees" },
]

[dipsw]
# MAME lists the ports alphabetically, which would put BUTTON2 first.
# Pin them to the layout jtskykid_cab reads.
offset=[
	{ name="DSWA",    value=0  },
	{ name="DSWB",    value=8  },
	{ name="BUTTON2", value=16 },
]
# Sky Kid has no switches on BUTTON2, so its two unused inputs would default
# to 0, which the game reads as pressed and boots into the test screen
defaults=[
	{ machine="skykid", value="ff,ff,ff" },
]

[ROM]
regions = [
	# 0x8000-0xffff static, 0x10000-0x13fff banked as 2x8kB
	{ name="maincpu", no_offset=true              },
	{ name="mcusub",  start="JTFRAME_BA1_START"   },
	{ name="chars",   start="JTFRAME_BA2_START"   },
	{ name="tiles",   start="BG_START"            },
	# init_skykid unpacks the third plane at run time. The same layout is
	# built here instead: tiles 0-255 come from the first ROM, tiles 256-511
	# from the upper half of the second one (twice, as MAME does), and the
	# third plane from its lower half, streamed twice. The nibble is picked
	# in the HDL, and tiles 256-511 have no third plane at all.
	{ name="sprites", start="JTFRAME_BA3_START", setname="drgnbstr", parts=[
		{name="db1_8.10n", crc="11942c61", offset=0x0000, length=0x2000},
		{name="db1_8.10n", crc="11942c61", offset=0x2000, length=0x2000},
		{name="db1_7.10m", crc="cc130fe2", offset=0x2000, length=0x2000},
		{name="db1_7.10m", crc="cc130fe2", offset=0x2000, length=0x2000},
		{name="db1_7.10m", crc="cc130fe2", offset=0x0000, length=0x2000},
		{name="db1_7.10m", crc="cc130fe2", offset=0x0000, length=0x2000},
	]},
	{ name="sprites", start="JTFRAME_BA3_START", machine="skykid", parts=[
		{name="sk1_8.10n", crc="44bb7375", offset=0x0000, length=0x2000},
		{name="sk1_8.10n", crc="44bb7375", offset=0x2000, length=0x2000},
		{name="sk1_7.10m", crc="3454671d", offset=0x2000, length=0x2000},
		{name="sk1_7.10m", crc="3454671d", offset=0x2000, length=0x2000},
		{name="sk1_7.10m", crc="3454671d", offset=0x0000, length=0x2000},
		{name="sk1_7.10m", crc="3454671d", offset=0x0000, length=0x2000},
	]},
	{ name="mcu",     start="JTFRAME_PROM_START"  },
	{ name="proms"                                },
]

order=["maincpu","mcusub","chars","tiles","sprites","mcu","proms"]
