params:
  - { name: PCM_OFFSET, value: "(`PCM_START-`JTFRAME_BA1_START) >> 1" }
clocks:
  clk48:
    - freq: 24M
      outputs:
        - cen24
        - cen12
    - freq: 3579545
      outputs:
        - cen_fm
        - cen_fm2
audio:
  rsum: 10k
  channels:
    - { name: fm,  module: jtopl2,   rsum: 10k   }
    - { name: pcm, module: jt053260, rsum: 14.3k }
sdram:
  banks:
    - buses:
        - name: main
          addr_width: 17
          data_width: 8
    - buses:
        - name: snd
          addr_width: 15
          data_width: 8
        - { name: pcma, addr_width: 21, data_width: 8, offset: PCM_OFFSET }
        - { name: pcmb, addr_width: 21, data_width: 8, offset: PCM_OFFSET }
        - { name: pcmc, addr_width: 21, data_width: 8, offset: PCM_OFFSET }
        - { name: pcmd, addr_width: 21, data_width: 8, offset: PCM_OFFSET }
    - buses:
        - name: psac
          addr_width: 19
          data_width: 8
    - buses:
        - name: lyro
          addr_width: 21
          data_width: 32
bram:
  - name: ram
    addr_width: 13
    data_width: 8
    rw: true
    addr: main_addr[12:0]
